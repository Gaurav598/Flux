services:
  postgres:
    image: postgres:15-alpine
    container_name: flux-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flux-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flux-redis
    networks:
      - flux-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: flux-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      - zookeeper
    networks:
      - flux-network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: flux-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
    networks:
      - flux-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: flux-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/flux.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flux-network
    restart: unless-stopped

  backend:
    image: ${DOCKER_USERNAME}/flux-backend:${FLUX_IMAGE_TAG:-latest}
    container_name: flux-backend
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      FIREBASE_CREDENTIALS_PATH: /opt/flux/firebase-service-account.json
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - ./firebase-service-account.json:/opt/flux/firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - flux-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:

networks:
  flux-network:
    driver: bridge
