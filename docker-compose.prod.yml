services:
  postgres:
    image: postgres:15-alpine
    container_name: flux-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flux-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flux-redis
    networks:
      - flux-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: flux-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      - zookeeper
    networks:
      - flux-network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: flux-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
    networks:
      - flux-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: flux-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/flux.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - flux-network
    restart: unless-stopped

  backend:
    image: ${DOCKER_USERNAME}/flux-backend:latest
    container_name: flux-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FIREBASE_CREDENTIALS_PATH: /opt/flux/firebase-service-account.json
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
    volumes:
      - ./firebase-service-account.json:/opt/flux/firebase-service-account.json
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - flux-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  flux-network:
    driver: bridge
